name: Package CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: moglang/package-actions/.github/workflows/source-ci.yml@v1
    with:
      package_name: package-template
      runtime_ref: main
